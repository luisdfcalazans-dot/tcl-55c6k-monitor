name: monitor 55C6K

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      resumo:
        description: "Enviar o resumo diário agora"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Coletar e alertar
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CANAIS_EXTRA: ${{ vars.TELEGRAM_CANAIS_EXTRA }}
          ALVO_PIX: ${{ vars.ALVO_PIX }}
          ALVO_PARCELADO: ${{ vars.ALVO_PARCELADO }}
        run: python run.py --mode cloud ${{ github.event.inputs.resumo == 'true' && '--resumo' || '' }}

      - name: Salvar estado no repositório
        run: |
          git config user.name "monitor-bot"
          git config user.email "monitor-bot@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then echo "nada a commitar"; exit 0; fi
          git commit -m "coleta cloud $(date -u +'%Y-%m-%d %H:%M')"
          for i in 1 2 3 4; do
            git pull --rebase --autostash && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
